# Balanceador das 3 instâncias da api (D7.4). Não roteia pela readiness (D5,
# B7.7): o tráfego continua com o SQS fora. Só repete numa outra instância o
# que falhou antes de chegar à api (erro de conexão); um POST que já chegou
# nunca é repetido pelo nginx (padrão sem `non_idempotent`): quem reenvia é o
# provedor, com a mesma Idempotency-Key (D3.4).
events {
  # D26 (teste de carga): o padrão de 512 virava `500` do próprio nginx
  # ("512 worker_connections are not enough") a 400 req/s. Sem keepalive no
  # upstream, cada requisição em andamento ocupa 2 conexões (cliente → nginx e
  # nginx → api): 512 / 2 = ~256 requisições simultâneas. Com 4096: ~2048, acima
  # dos 600 VUs do maior passo do k6 (1200 conexões). Keepalive no upstream fica
  # de fora de propósito (nginx/README.md).
  worker_connections 4096;
}

http {
  # DNS do Docker: uma api reiniciada pode voltar com outro IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api {
    zone api 64k;
    server api-1:3000 resolve;
    server api-2:3000 resolve;
    server api-3:3000 resolve;
  }

  # Tempo real (D28.9): as 2 instâncias do realtime, cada uma com a sua fila.
  upstream realtime {
    zone realtime 64k;
    server realtime-1:3001 resolve;
    server realtime-2:3001 resolve;
  }

  # O upgrade para WebSocket precisa do `Connection: upgrade` (D28.9); sem
  # `Upgrade` no pedido, o header vai como `close`.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;

    # WebSocket (D28.9). O handshake é um GET sem efeito: repetir em outra
    # instância é seguro. O prazo de leitura fica acima do ping de 30 s do
    # servidor, senão o nginx derruba uma conexão ociosa.
    location /realtime {
      proxy_pass http://realtime;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      proxy_next_upstream error timeout;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      # Acima do prazo de 10 s da api (D21.3): o 503 dela chega antes do 504 do nginx.
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
      proxy_next_upstream error;
    }
  }
}
