services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering_app
      POSTGRES_PASSWORD: wagering_app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering_app -d wagering"]
      interval: 2s
      timeout: 2s
      retries: 30

  localstack:
    image: localstack/localstack:3
    environment:
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/localstack-init.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build: .
    command: ["src/entrypoints/main-api.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: wagering
      DB_USER: wagering_app
      DB_PASSWORD: wagering_app
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://localstack:4566
      SNS_TOPIC_WAGERING_EVENTS: wagering-events.fifo
      QUEUE_WAGER_TRANSACTIONS: wager-transactions.fifo
      QUEUE_WAGER_TRANSACTIONS_DLQ: wager-transactions-dlq.fifo
      QUEUE_WAGERING_EVENTS_AUDITOR: wagering-events-auditor.fifo
    ports:
      - "3000:3000"
