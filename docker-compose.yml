# Topologia da D7.4: mesma imagem, um entrypoint por processo.
#   nginx → api ×3; consumer ×3; outbox-publisher ×2; pending-worker ×2; event-auditor ×1;
#   accounting-consumer ×2 (D27.6); nginx /realtime → realtime ×2 (D28.11).
# O bun é o PID 1 de cada container (ENTRYPOINT em forma exec no Dockerfile e
# `command` em lista, sem shell): o SIGTERM do `docker compose stop` chega a
# ele (D21.2). Cada processo tem 30 s para parar (D8.5, D8.6).

x-app: &app
  image: wagering-app:local
  build: .
  restart: unless-stopped
  stop_grace_period: 30s
  # /metrics (D11.2, D22.1): só na rede interna do Compose, sem `ports`, sem
  # auth. O nginx não roteia para ela.
  expose:
    - "9464"
  depends_on:
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    localstack:
      condition: service_healthy

x-app-env: &app-env
  NODE_ENV: development
  # A config exige PORT em todo processo; só a api escuta nela.
  PORT: "3000"
  # Porta interna do /metrics, em todo processo (D22.1).
  METRICS_PORT: "9464"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: wagering
  DB_USER: wagering_app
  DB_PASSWORD: wagering_app
  AWS_REGION: us-east-1
  AWS_ENDPOINT: http://localstack:4566
  SNS_TOPIC_WAGERING_EVENTS: wagering-events.fifo
  QUEUE_WAGER_TRANSACTIONS: wager-transactions.fifo
  QUEUE_WAGER_TRANSACTIONS_DLQ: wager-transactions-dlq.fifo
  QUEUE_WAGERING_EVENTS_AUDITOR: wagering-events-auditor.fifo
  QUEUE_WAGERING_EVENTS_AUDITOR_DLQ: wagering-events-auditor-dlq.fifo

x-api: &api
  <<: *app
  command: ["src/entrypoints/main-api.ts"]
  # A api sobe com a wallet do exemplo já criada (D23.1) e o Keycloak de pé.
  depends_on:
    migrate:
      condition: service_completed_successfully
    seed:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    localstack:
      condition: service_healthy
    keycloak:
      condition: service_healthy

# Tempo real (D28.11): sem banco, então não espera o Postgres nem o migrate, e
# não recebe credencial de banco nem a config comum. A fila de cada instância
# vem do init do LocalStack, já assinada no tópico (D28.5).
x-realtime: &realtime
  image: wagering-app:local
  build: .
  restart: unless-stopped
  stop_grace_period: 30s
  command: ["src/entrypoints/main-realtime.ts"]
  expose:
    - "9464"
  depends_on:
    localstack:
      condition: service_healthy
    keycloak:
      condition: service_healthy

x-realtime-env: &realtime-env
  NODE_ENV: development
  METRICS_PORT: "9464"
  AWS_REGION: us-east-1
  AWS_ENDPOINT: http://localstack:4566
  AUTH_ISSUER: http://localhost:8080/realms/wagering
  AUTH_AUDIENCE: wagering-api
  AUTH_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
  REALTIME_PORT: "3001"

x-api-env: &api-env
  <<: *app-env
  # D10.1, D23.3: o emissor é o KC_HOSTNAME do Keycloak (o mesmo `iss` qualquer
  # que seja o host usado para pedir o token); o JWKS vem pela rede interna.
  AUTH_ISSUER: http://localhost:8080/realms/wagering
  AUTH_AUDIENCE: wagering-api
  AUTH_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wagering
      # Superusuário só do init; a aplicação e as migrations usam os papéis abaixo (D7.3).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DB_OWNER_PASSWORD: wagering_owner
      DB_APP_PASSWORD: wagering_app
      DB_ACCOUNTING_PASSWORD: accounting_app
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    # TCP (-h 127.0.0.1): durante o init, o servidor temporário só escuta no socket
    # Unix; sem -h, o healthcheck passaria antes do Postgres aceitar conexões de rede.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d wagering"]
      interval: 2s
      timeout: 2s
      retries: 30
      # 1ª subida num volume novo (init + checkpoint) numa máquina lenta (D27.10).
      start_period: 180s

  localstack:
    image: localstack/localstack:3
    environment:
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/localstack-init.sh:ro
    # D27.11: saudável só depois de o init terminar com sucesso (filas e assinaturas
    # criadas). O /_localstack/health passa antes, e um evento publicado antes de a
    # fila de um assinante existir não chega a ela (sem backfill, D27.7).
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json,urllib.request as r;d=json.load(r.urlopen('http://localhost:4566/_localstack/init/ready',timeout=2));s=d['scripts'];raise SystemExit(0 if d['completed'] and s and all(x['state']=='SUCCESSFUL' for x in s) else 1)"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 60s

  # One-shot: aplica as migrations com o papel dono e sai (D7.3).
  migrate:
    image: wagering-app:local
    build: .
    command: ["scripts/migrate.ts", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: wagering
      DB_USER: wagering_app
      DB_PASSWORD: wagering_app
      DB_MIGRATION_USER: wagering_owner
      DB_MIGRATION_PASSWORD: wagering_owner

  # One-shot: cria a wallet do exemplo do §9/§10 pelo use case real (D23.1).
  # Só no Compose de dev; com a wallet já criada, não faz nada.
  seed:
    image: wagering-app:local
    build: .
    command: ["scripts/seed-examples.ts"]
    # O seed grava os eventos da abertura na outbox; com o LocalStack saudável
    # (init concluído, D27.11), todas as filas assinantes já existem.
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: wagering
      DB_USER: wagering_app
      DB_PASSWORD: wagering_app
      DB_APPLICATION_NAME: seed

  # IdP externo (R-02-03, D10.1). Realm importado do repositório (D23.4).
  # Admin e segredos dos clients são de desenvolvimento, não segredos reais.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Emissor fixo (D23.3): o `iss` é sempre este, e as chamadas internas
      # (keycloak:8080, o JWKS da api) usam o host da própria requisição.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-wagering.json:/opt/keycloak/data/import/realm-wagering.json:ro
    # A imagem não tem curl: o /health/ready (porta de gestão 9000) via /dev/tcp do bash.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3",
        ]
      interval: 3s
      timeout: 3s
      retries: 60
      # Importação do realm na 1ª subida, numa máquina lenta (D27.10).
      start_period: 180s

  # Única porta da api para fora: os `curl` do §9 vão para localhost:3000.
  nginx:
    # Versão exata: o `server … resolve` do upstream só existe a partir da 1.27.3 (nginx/README.md).
    image: nginx:1.27.5-alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
      - realtime-1
      - realtime-2
    restart: unless-stopped

  api-1:
    <<: *api
    environment:
      <<: *api-env
      DB_APPLICATION_NAME: api-1

  api-2:
    <<: *api
    environment:
      <<: *api-env
      DB_APPLICATION_NAME: api-2

  api-3:
    <<: *api
    environment:
      <<: *api-env
      DB_APPLICATION_NAME: api-3

  consumer:
    <<: *app
    command: ["src/entrypoints/main-consumer.ts"]
    environment: *app-env
    deploy:
      replicas: 3

  outbox-publisher:
    <<: *app
    command: ["src/entrypoints/main-outbox-publisher.ts"]
    environment: *app-env
    deploy:
      replicas: 2

  pending-worker:
    <<: *app
    command: ["src/entrypoints/main-pending-worker.ts"]
    environment: *app-env
    deploy:
      replicas: 2

  event-auditor:
    <<: *app
    command: ["src/entrypoints/main-event-auditor.ts"]
    environment: *app-env
    deploy:
      replicas: 1

  # Partidas dobradas (D27.6): outro serviço, só por eventos; papel próprio no banco (D27.3).
  accounting-consumer:
    <<: *app
    command: ["src/entrypoints/main-accounting-consumer.ts"]
    environment:
      <<: *app-env
      DB_USER: accounting_app
      DB_PASSWORD: accounting_app
      QUEUE_ACCOUNTING_EVENTS: wagering-events-accounting.fifo
      QUEUE_ACCOUNTING_EVENTS_DLQ: wagering-events-accounting-dlq.fifo
    deploy:
      replicas: 2

  # Tempo real (D28.5): o id estável dá o nome da fila de cada instância.
  realtime-1:
    <<: *realtime
    environment:
      <<: *realtime-env
      REALTIME_INSTANCE_ID: realtime-1

  realtime-2:
    <<: *realtime
    environment:
      <<: *realtime-env
      REALTIME_INSTANCE_ID: realtime-2
