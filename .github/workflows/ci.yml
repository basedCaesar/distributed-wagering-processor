# CI (D25): a cada push e pull request, em Linux.
#   check      → infraestrutura de teste + `bun run check` inteiro (com o SIGTERM real, D21.2)
#   acceptance → Compose de dev + `bun run acceptance` duas vezes (D23.2, D23.7) + `accounting:reconcile` (D27.7)
# Em falha, os logs dos testes (logs/) e dos containers sobem como artefato (D25.4).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Um push novo no mesmo ref cancela a rodada anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Saída do bun sem cores, para a conferência dos pulados ler o texto puro (D25.3).
  NO_COLOR: "1"

jobs:
  check:
    name: check (typecheck, lint, unidade, integração, concorrência, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # A mesma versão do Dockerfile e do @types/bun (D25.2).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Só o cache das dependências; as imagens vêm do registry (D25.6).
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run infra:test:up

      - name: bun run check
        run: |
          mkdir -p logs/ci
          bun run check 2>&1 | tee logs/ci/check.log

      # D25.3: no Linux nada é pulado. Os 6 pulados do Windows são o SIGTERM
      # real (sigterm.spec.ts, D21.2, e accounting-sigterm.spec.ts, D27.9);
      # aqui eles precisam ter passado.
      - name: conferir 0 skip e os 6 SIGTERM reais
        run: |
          log=$(sed 's/\x1b\[[0-9;]*m//g' logs/ci/check.log)
          skipped=$(grep -E '^\s*[1-9][0-9]* (skip|todo)$' <<<"$log" || true)
          if [ -n "$skipped" ]; then
            echo "::error::testes pulados no Linux (D25.3):"
            echo "$skipped"
            exit 1
          fi
          sigterm=$(grep -E '^\(pass\) .*recebe SIGTERM' <<<"$log" || true)
          echo "$sigterm"
          count=$(grep -c . <<<"$sigterm" || true)
          if [ "$count" -ne 6 ]; then
            echo "::error::esperados 6 testes de SIGTERM real passando; encontrados $count (D21.2, D25.3, D27.9)"
            exit 1
          fi

      - name: logs dos containers
        if: failure()
        run: |
          mkdir -p logs/ci
          docker compose -f docker-compose.test.yml ps -a > logs/ci/compose-test-ps.log 2>&1 || true
          docker compose -f docker-compose.test.yml logs --no-color --timestamps > logs/ci/compose-test.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-logs
          path: logs/
          retention-days: 14
          if-no-files-found: warn

  acceptance:
    name: acceptance (Compose de dev, §9 e §10 literais, 2×)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Literal, com --build (D23.8). A aceitação espera a api ficar pronta (D23.6).
      - run: bun run infra:up

      - name: aceitação, 1ª rodada (idempotentReplay false)
        run: |
          mkdir -p logs/ci
          bun run acceptance 2>&1 | tee logs/ci/acceptance-1.log

      - name: aceitação, 2ª rodada (idempotentReplay true)
        run: bun run acceptance 2>&1 | tee logs/ci/acceptance-2.log

      # D27.7: o accounting-consumer do Compose consumiu tudo e o diário bate com o núcleo.
      - name: reconciliação do diário de partidas dobradas
        run: bun run accounting:reconcile --wait 120 2>&1 | tee logs/ci/accounting-reconcile.log

      - name: logs dos containers
        if: failure()
        run: |
          mkdir -p logs/ci
          docker compose ps -a > logs/ci/compose-dev-ps.log 2>&1 || true
          docker compose logs --no-color --timestamps > logs/ci/compose-dev.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: acceptance-logs
          path: logs/
          retention-days: 14
          if-no-files-found: warn
