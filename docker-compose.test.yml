name: distributed-wagering-processor-test

services:
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wagering_test
      # Superusuário só do init; a aplicação e as migrations usam os papéis abaixo (D7.3).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DB_OWNER_PASSWORD: wagering_owner
      DB_APP_PASSWORD: wagering_app
    ports:
      - "5433:5432"
    volumes:
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    # TCP (-h 127.0.0.1): durante o init, o servidor temporário só escuta no socket
    # Unix; sem -h, o healthcheck passaria antes do Postgres aceitar conexões de rede.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d wagering_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  localstack_test:
    image: localstack/localstack:3
    environment:
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4567:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/localstack-init.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 2s
      retries: 30
