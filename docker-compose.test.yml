name: distributed-wagering-processor-test

services:
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wagering_test
      # Superusuário só do init; a aplicação e as migrations usam os papéis abaixo (D7.3).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DB_OWNER_PASSWORD: wagering_owner
      DB_APP_PASSWORD: wagering_app
      DB_ACCOUNTING_PASSWORD: accounting_app
    ports:
      - "5433:5432"
    volumes:
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    # TCP (-h 127.0.0.1): durante o init, o servidor temporário só escuta no socket
    # Unix; sem -h, o healthcheck passaria antes do Postgres aceitar conexões de rede.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d wagering_test"]
      interval: 2s
      timeout: 2s
      retries: 30
      # 1ª subida num volume novo (init + checkpoint) numa máquina lenta (D27.10).
      start_period: 180s

  # Keycloak do e2e (D23.5): o mesmo realm do dev, na porta 8081, com o
  # emissor fixo no localhost:8081 (D23.3; E2E_KEYCLOAK_URL do .env.test).
  keycloak_test:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-wagering.json:/opt/keycloak/data/import/realm-wagering.json:ro
    # A imagem não tem curl: o /health/ready (porta de gestão 9000) via /dev/tcp do bash.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3",
        ]
      interval: 3s
      timeout: 3s
      retries: 60
      # Importação do realm na 1ª subida, numa máquina lenta (D27.10).
      start_period: 180s

  localstack_test:
    image: localstack/localstack:3
    environment:
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4567:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/localstack-init.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 2s
      retries: 30
